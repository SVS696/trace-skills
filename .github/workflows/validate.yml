name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: OpenSpec dependency and both-harness integration
        env:
          TRACE_TEST_OPENSPEC: "1"
          OPENSPEC_TELEMETRY: "0"
        run: |
          npm install -g @fission-ai/openspec@1.13.0
          python3 -m unittest discover -s tests -p test_openspec_bridge.py -v
      - name: Claude Smoke Break adapter tests
        working-directory: integrations/smoke-break/claude-marketplace/plugins/smoke-break
        run: npm test
      - name: Method library provenance and coverage
        run: python3 scripts/rule_library.py validate
      - name: Compile Python
        run: python3 -m compileall -q scripts tests
